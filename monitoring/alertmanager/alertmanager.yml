global:
  resolve_timeout: 5m

route:
  receiver: local-alerts
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: local-alerts
    webhook_configs:
      - url: http://alert-webhook:8085/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="FraudAPIDown"
    target_matchers:
      - severity="warning"
    equal:
      - service
