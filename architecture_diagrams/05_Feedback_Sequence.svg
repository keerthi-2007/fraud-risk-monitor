<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1050" viewBox="0 0 2400 1050">
<defs><marker id="arr" markerWidth="15" markerHeight="15" refX="11" refY="6" orient="auto"><path d="M1,1 L12,6 L1,11" fill="none" stroke="#6A7E9B" stroke-width="2.5"/></marker></defs>
<rect width="2400" height="1050" fill="#F5F8FC"/>
<text x="85" y="110" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#172D47">Verified Feedback to Candidate Retraining</text>
<text x="88" y="157" font-family="DejaVu Sans" font-size="24" fill="#576D86">Separate host-side workflow — not a DVC stage or automatic live deployment</text>
<rect x="62" y="205" width="545" height="575" rx="23" fill="white" stroke="#5E93D2" stroke-width="3"/>
<path d="M85,205 H584 Q607,205 607,228 V310 H62 V228 Q62,205 85,205" fill="#EAF3FF"/>
<text x="90" y="270" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#20334E">01  FEEDBACK CAPTURE</text>
<text x="89" y="370" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">Investigator confirms a</text>
<text x="89" y="429" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">fraud or legitimate outcome</text>
<text x="89" y="547" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">FastAPI validates token</text>
<text x="89" y="606" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">and stores feedback JSONL</text>
<path d="M616,535 H644" stroke="#6A7E9B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="656" y="205" width="545" height="575" rx="23" fill="white" stroke="#D99B48" stroke-width="3"/>
<path d="M679,205 H1178 Q1201,205 1201,228 V310 H656 V228 Q656,205 679,205" fill="#FFF3E2"/>
<text x="684" y="270" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#20334E">02  INDEPENDENT APPROVAL</text>
<text x="683" y="370" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">Authorised reviewer verifies</text>
<text x="683" y="429" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">the outcome independently</text>
<text x="683" y="547" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">approve_feedback.py writes</text>
<text x="683" y="606" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">approved_feedback.jsonl</text>
<path d="M1210,535 H1238" stroke="#6A7E9B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="1250" y="205" width="545" height="575" rx="23" fill="white" stroke="#57AA83" stroke-width="3"/>
<path d="M1273,205 H1772 Q1795,205 1795,228 V310 H1250 V228 Q1250,205 1273,205" fill="#E8F7EF"/>
<text x="1278" y="270" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#20334E">03  ELIGIBILITY CHECK</text>
<text x="1277" y="370" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">Host watcher checks ~60 s</text>
<text x="1277" y="429" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">Removes invalid and duplicate</text>
<text x="1277" y="488" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">records / known dataset rows</text>
<text x="1277" y="606" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">20 eligible + 3 per class</text>
<path d="M1804,535 H1832" stroke="#6A7E9B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="1844" y="205" width="545" height="575" rx="23" fill="white" stroke="#9878CF" stroke-width="3"/>
<path d="M1867,205 H2366 Q2389,205 2389,228 V310 H1844 V228 Q1844,205 1867,205" fill="#F1ECFC"/>
<text x="1872" y="270" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#20334E">04  CANDIDATE EVALUATION</text>
<text x="1871" y="370" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">Retrain on original train +</text>
<text x="1871" y="429" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">new approved feedback</text>
<text x="1871" y="547" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">Evaluate on validation; MLflow</text>
<text x="1871" y="606" font-family="DejaVu Sans" font-size="25" fill="#2B3E56">promotion eligibility gates</text>
<rect x="62" y="830" width="2285" height="150" rx="21" fill="#EAF0FA" stroke="#B6C9E1" stroke-width="2"/>
<text x="95" y="880" font-family="DejaVu Sans" font-weight="700" font-size="27" fill="#203957">Observed status</text>
<text x="95" y="925" font-family="DejaVu Sans" font-size="24" fill="#334B65">Worker publishes approval and eligibility counts to retraining_monitor.json; Streamlit reads them via token-protected status API.</text>
<text x="95" y="962" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#AA505E">Safety: automatic model deployment is OFF by default. The active approved model remains unchanged without explicit opt-in.</text>
</svg>