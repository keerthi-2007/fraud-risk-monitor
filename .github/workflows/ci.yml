name: AIOps CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-pipeline:
    name: Code style and DVC pipeline validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tooling
        run: python -m pip install ruff dvc==3.67.1

      - name: Ruff (PEP 8 / pyflakes)
        run: ruff check .

      - name: Validate DVC pipeline DAG
        run: |
          dvc dag
          dvc dag --md >> "$GITHUB_STEP_SUMMARY"

      - name: Check MLproject and params are well-formed
        run: |
          python -c "import yaml; yaml.safe_load(open('MLproject')); yaml.safe_load(open('params.yaml')); yaml.safe_load(open('python_env.yaml'))"

  portable-tests:
    name: Portable automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-api.txt \
            pytest httpx requests PyYAML

      - name: Check Python syntax
        run: python -m compileall -q backend frontend scripts tests

      - name: Run portable tests
        run: |
          python -m pytest \
            tests/test_api.py \
            tests/test_csv_drift_integration.py \
            tests/test_drift_detector.py \
            tests/test_drift_monitor.py \
            tests/test_explain.py \
            tests/test_feedback.py \
            tests/test_feedback_encryption.py \
            tests/test_feedback_metrics.py \
            tests/test_feedback_metrics_api.py \
            tests/test_feedback_monitor.py \
            tests/test_model_loading.py \
            tests/test_pipeline_client.py \
            tests/test_pipeline_history.py \
            tests/test_pipeline_status.py \
            tests/test_pipeline_status_api.py \
            tests/test_run_pipeline_stage.py \
            tests/test_spark_throughput.py \
            -q


      - name: Test feedback retraining and model promotion
        run: |
          python -m pytest \
            tests/test_auto_retrain.py \
            tests/test_auto_retrain_approval.py \
            tests/test_auto_promotion.py \
            tests/test_deploy_candidate.py \
            tests/test_isolated_retraining_e2e.py \
            tests/test_retraining_auto_deploy.py \
            tests/test_retraining_cycle.py \
            tests/test_rollback_env_snapshot.py \
            tests/test_retraining_status_api.py \
            -q

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t aiops-backend-ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t aiops-frontend-ci .

      - name: Build MLflow serving image
        run: docker build -f mlflow_serving/Dockerfile -t aiops-mlflow-serve-ci .
