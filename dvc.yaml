stages:
  prepare_data:
    cmd: python scripts/clean_dataset.py
    deps:
    - data/raw/creditcard.csv
    - requirements.txt
    - scripts/clean_dataset.py
    outs:
    - data/processed/creditcard_prepared.csv
  create_splits:
    cmd: python scripts/create_splits.py
    deps:
    - data/processed/creditcard_prepared.csv
    - requirements.txt
    - scripts/create_splits.py
    outs:
    - data/processed/splits
  spark_audit:
    cmd: python scripts/spark_audit.py
    deps:
    - data/raw/creditcard.csv
    - requirements.txt
    - scripts/spark_audit.py
    outs:
    - data/processed/spark_audit.json
  spark_transform:
    cmd: python scripts/spark_transform.py
    deps:
    - data/raw/creditcard.csv
    - requirements.txt
    - scripts/spark_transform.py
    outs:
    - data/processed/spark_features
    metrics:
    - metrics/spark_transform.json:
        cache: false
  build_drift_baseline:
    cmd: python -m scripts.build_drift_baseline
    deps:
    - data/processed/splits/train.csv
    - scripts/build_drift_baseline.py
    - scripts/drift_detector.py
    - requirements.txt
    outs:
    - monitoring/drift_baseline.json:
        cache: false
  eda:
    cmd: python scripts/run_eda.py
    deps:
    - data/raw/creditcard.csv
    - requirements.txt
    - scripts/run_eda.py
    outs:
    - data/reports/eda_summary.md:
        cache: false
    - data/reports/eda_class_balance.png
    - data/reports/eda_amount_by_class.png
    - data/reports/eda_feature_distributions.png
    - data/reports/eda_correlations.png
    - data/reports/eda_duplicate_groups.png
  train_baselines:
    cmd: python scripts/train_baselines.py
    deps:
    - data/processed/splits/train.csv
    - data/processed/splits/validation.csv
    - data/processed/splits/split_manifest.json
    - requirements.txt
    - scripts/train_baselines.py
    params:
    - train
    metrics:
    - metrics/train_metrics.json:
        cache: false
    outs:
    - metrics/feature_importance.json:
        cache: false
